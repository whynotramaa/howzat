<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Howzat — every ball, on the record</title>
    <meta
      name="description"
      content="Run a local cricket tournament properly. Ball-by-ball scoring from your phone, a points table that keeps itself, and one link anyone can follow live."
    />

    <meta name="theme-color" content="#f5f6f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)" />

    <!--
      Newsreader for display, Instrument Sans for interface, DM Mono for figures
      in columns. Newsreader is requested across its full optical-size axis so
      the browser can cut a 48px title differently from a 20px heading.
      Preconnected because the wordmark is the first thing painted, and that is
      the one place a font swap is actually visible.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=DM+Mono:wght@300;400;500&display=swap"
    />

    <script>
      // Applied before first paint, so a dark-theme user never sees bone flash.
      (function () {
        try {
          var stored = localStorage.getItem('howzat-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
