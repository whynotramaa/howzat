    <meta property="og:type" content="website" />

    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('howzat-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (_) {}
      })();
    </script>
