# Render blueprint for the Howzat API.
#
# The web app is not here — it is a static Vite build and belongs on Vercel.
# Postgres (Neon) and Redis (Upstash) are external too, so this file describes
# exactly one long-lived process: the Express + Socket.IO server.
services:
  - type: web
    name: howzat-api
    runtime: node
    plan: free
    region: singapore
    # Migrations run in the build, not at boot: a failed migration should fail
    # the deploy rather than crash-loop a container that is already live.
    buildCommand: >-
      npm ci &&
      npm run db:generate --workspace @howzat/api &&
      npm run db:deploy:ci --workspace @howzat/api &&
      npm run build --workspace @howzat/api
    startCommand: node apps/api/dist/index.js
    # Liveness, not readiness. /health returns 503 whenever Postgres or Redis
    # is briefly unreachable, which would make Render tear down a healthy
    # instance over a dependency blip.
    healthCheckPath: /health/live
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Render injects PORT; env.ts reads it.
      - key: API_BASE_URL
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: OTP_FROM_EMAIL
        value: oct8@rama.codes
