name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The Prisma client is generated code that typecheck depends on, and it
      # is not committed. No database connection is needed to generate it.
      - run: npm run db:generate

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          # Only the VITE_ vars reach the web build; the API bundle needs none.
          VITE_API_BASE_URL: http://localhost:4000
          VITE_SOCKET_URL: http://localhost:4000
